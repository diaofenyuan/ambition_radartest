# RMUC 无线电规则参数
# 业务帧：2027 通信协议 V1.0.0 §1.5（2026-10-29 发布）
# 射频/空口：规则手册 V2.2.0 表 5-23/附录 1（2027 规则手册发布后替换本文件射频段）
# 赛季更替只换 YAML，不动代码。

season: 2026

modulation:
  type: 2-GFSK
  sample_rate_hz: 1000000      # 1 MS/s
  samples_per_symbol: 47       # 码率 = 1e6/47 ≈ 21276.6 bps
  gfsk_bt: 0.35                # 高斯滤波带宽×符号时长积
  gaussian_span_symbols: 4     # 高斯滤波器跨 4 个符号

air_protocol:
  access_code_info: "2F6F4C74B914492E"
  access_code_interfere: "16E8D377151C712D"
  header: "000F000F"
  payload_len: 15
  # 每周期空口包数不写死：由业务字节数决定。信息波 150B/周期恰好 10 包，
  # 干扰波 135B/周期恰好 9 包。
  # 注意：10 包 = 101520 采样，超过 1MS/s 下的 100ms 周期预算（100000），
  # 2027 规则手册给出新比特率前，服务启动会输出空口容量告警。
  cycles_per_sec: 10

business:
  key_len_ascii: 6             # 0x0A06 密钥固定 6 字节（数字字母组合）
  key_pad_char: "0"
  buff_payload_lens: [47]      # 0x0A05 载荷 47 字节（通信协议 V1.0.0 表 1-45）
  # 信息波 0x0A01~0x0A05 各 10Hz：24+12+10+12+47 + 5×9B 帧开销 = 150B/周期
  info_bytes_per_cycle: 150
  jammer_bytes_per_cycle: 135  # 干扰波 1350B/s = 135B/周期 = 9 空口包，含 1 帧 0x0A06 + 随机填充

# 频点 / 带宽 / 规则标称功率。频偏由带宽推导：f_dev = bandwidth/2 - bit_rate
rf_profiles:
  red:
    info:      { freq_hz: 433200000, bandwidth_hz: 540000, power_dbm: -60 }
    jammer_1:  { freq_hz: 432200000, bandwidth_hz: 940000, power_dbm: -10 }
    jammer_2:  { freq_hz: 432500000, bandwidth_hz: 860000, power_dbm: -10 }
    jammer_3:  { freq_hz: 432800000, bandwidth_hz: 250000, power_dbm: -10 }
  blue:
    info:      { freq_hz: 433920000, bandwidth_hz: 540000, power_dbm: -60 }
    jammer_1:  { freq_hz: 434920000, bandwidth_hz: 940000, power_dbm: -10 }
    jammer_2:  { freq_hz: 434620000, bandwidth_hz: 860000, power_dbm: -10 }
    jammer_3:  { freq_hz: 434320000, bandwidth_hz: 250000, power_dbm: -10 }

tx_limits:
  attenuation_db_min: 0        # 发射衰减调节范围（硬件增益域）
  attenuation_db_max: 89
  default_attenuation_db: 40   # 默认大衰减起步，符合"低功率先行"的测试要求
