# 双 PlutoSDR 发射设备配置
# mode: sim = 虚拟 SDR（无硬件回环自检）；pluto = 真实设备。
#
# uri 支持三种写法，按稳定性从低到高：
#   usb:2.6.5        USB 直连；掉线重连后端口号会变（实测 2.13.5 → 2.15.5 → 2.6.5）
#   ip:192.168.2.1   网口，需先把两块板改到不同网段（各自固件 config.txt），详见 README
#   serial:03df6d62  推荐：按 serial 绑定，端口号怎么变都能找到同一块板

mode: sim

info_tx:
  name: "信息波发射板"
  uri: "ip:192.168.2.1"
  attenuation_db: 40

jammer_tx:
  name: "干扰波发射板"
  uri: "ip:192.168.3.1"
  attenuation_db: 40

# 发射流送参数
stream:
  tx_buffer_samples: 32768     # 单次推送到设备的采样数
  underflow_gap_ms: 30         # 欠采告警余量；Windows 调度粒度约 15ms，留两档抖动余量
